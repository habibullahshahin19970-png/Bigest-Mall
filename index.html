<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Bigest Mall — Mobile</title>
</head>
<body>
  <header class="app-header">
    <h1>Bigest Mall</h1>
    <button id="btn-install" class="install-btn" hidden>Install</button>
  </header>

  <!-- Authentication / Phone OTP section -->
  <section class="container auth-section" aria-labelledby="authTitle">
    <h2 id="authTitle" style="font-size:16px;margin:8px 0">Sign in with phone</h2>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="phone" type="tel" placeholder="+8801XXXXXXXXX" aria-label="Phone number" style="flex:1;padding:10px;border-radius:8px;border:1px solid #e6eef0" />
      <button id="sendOtp" class="install-btn">Send OTP</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="otp" type="text" placeholder="Enter OTP" aria-label="OTP code" style="flex:1;padding:10px;border-radius:8px;border:1px solid #e6eef0" />
      <button id="verifyOtp" class="install-btn">Verify</button>
    </div>
    <div id="authMessage" style="margin-top:8px;color:#475569;font-size:13px"></div>
    <div id="recaptcha-container"></div>
  </section>

  <main class="container">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search products..." aria-label="Search products" />
    </div>

    <div id="results" class="grid" aria-live="polite"></div>
  </main>

  <dialog id="productDialog" class="product-dialog">
    <button id="closeDialog" class="close">✕</button>
    <div id="dialogContent"></div>
  </dialog>

  <!-- Firebase compat SDKs (web) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <!-- Firebase config (replace with your project values) -->
  <script src="js/firebase-config.js"></script>
  <!-- Firebase auth helper -->
  <script src="js/auth-firebase.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
