<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Bigest Mall — Mobile</title>
</head>
<body>
  <header class="app-header">
    <h1>Bigest Mall</h1>
    <button id="btn-install" class="install-btn" hidden>Install</button>
  </header>

  <main class="container">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search products..." aria-label="Search products" />
    </div>

    <div id="results" class="grid" aria-live="polite"></div>
  </main>

  <dialog id="productDialog" class="product-dialog">
    <button id="closeDialog" class="close">✕</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
