<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biggest Mall - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Biggest Mall - Admin Panel</h1>
        <a href="index.html" class="bg-blue-700 px-4 py-2 rounded text-sm hover:bg-blue-800">Visit Store</a>
    </header>

    <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Add Product Form -->
        <div class="bg-white p-6 rounded-lg shadow-md md:col-span-1">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Add New Product</h2>
            <form id="productForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Product Name</label>
                    <input type="text" id="pName" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Price (SAR)</label>
                    <input type="number" id="pPrice" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Image URL</label>
                    <input type="url" id="pImg" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Category</label>
                    <input type="text" id="pCategory" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700">Add Product</button>
            </form>
        </div>

        <!-- Product List & Management -->
        <div class="bg-white p-6 rounded-lg shadow-md md:col-span-2">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Manage Products</h2>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse border border-gray-200 text-left text-sm">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border p-2">Image</th>
                            <th class="border p-2">Name</th>
                            <th class="border p-2">Price</th>
                            <th class="border p-2">Category</th>
                            <th class="border p-2">Action</th>
                        </tr>
                    </thead>
                    <tbody id="productList">
                        <!-- Dynamic Products will load here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script to handle Admin Actions -->
    <script>
        let products = JSON.parse(localStorage.getItem('mall_products')) || [
            { id: 1, name: "Smart Watch", price: 150, image: "https://via.placeholder.com/150", category: "Electronics" },
            { id: 2, name: "Wireless Earbuds", price: 90, image: "https://via.placeholder.com/150", category: "Electronics" }
        ];

        const productForm = document.getElementById('productForm');
        const productList = document.getElementById('productList');

        function renderProducts() {
            productList.innerHTML = '';
            products.forEach((p, index) => {
                productList.innerHTML += `
                    <tr>
                        <td class="border p-2"><img src="${p.image}" class="w-12 h-12 object-cover rounded"></td>
                        <td class="border p-2 font-medium">${p.name}</td>
                        <td class="border p-2">${p.price} SAR</td>
                        <td class="border p-2">${p.category}</td>
                        <td class="border p-2">
                            <button onclick="deleteProduct(${index})" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Delete</button>
                        </td>
                    </tr>
                `;
            });
            localStorage.setItem('mall_products', JSON.stringify(products));
        }

        productForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                image: document.getElementById('pImg').value,
                category: document.getElementById('pCategory').value
            };
            products.push(newProduct);
            renderProducts();
            productForm.reset();
            alert('Product added successfully!');
        });

        function deleteProduct(index) {
            if(confirm('Are you sure you want to delete this product?')) {
                products.splice(index, 1);
                renderProducts();
            }
        }

        renderProducts();
    </script>
</body>
</html>
