<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bigest Mall - Ultimate Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root{
      --primary-gold:#D4AF37;
      --secondary-blue:#0A2540;
      --dark-bg:#121212;
      --light-bg:#f4f6f8;
      --white:#ffffff;
      --text-color:#333333;
      --max-width:1200px;
    }
    *{box-sizing:border-box}
    body {
      margin:0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:var(--light-bg);
      color:var(--text-color);
      line-height:1.4;
    }
    .container{max-width:var(--max-width);margin:0 auto;padding:0 20px}

    /* Admin Login */
    #admin-login-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--dark-bg);
    }
    .login-card {
      background: var(--white);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .login-card h2 { color: var(--secondary-blue); margin-top: 0; text-align: center; }

    /* Dashboard Layout */
    #admin-dashboard { display: none; padding-bottom: 50px; }
    .admin-header {
      background: var(--secondary-blue);
      color: var(--white);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--primary-gold);
      margin-bottom: 30px;
    }
    .admin-logo { color: var(--primary-gold); font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .admin-card {
      background: var(--white);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .admin-card h3 {
      color: var(--secondary-blue);
      border-bottom: 2px solid var(--primary-gold);
      padding-bottom: 8px;
      margin-top: 0;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-group textarea { resize: vertical; height: 100px; }
    
    .btn-admin {
      background: var(--secondary-blue);
      color: var(--white);
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-admin:hover { background: var(--primary-gold); color: var(--dark-bg); }

    .product-list-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    .product-list-table th, .product-list-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    .product-list-table th { background: var(--secondary-blue); color: #fff; }
    .btn-delete { background: #d32f2f; color: #fff; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; }

    .toast{position:fixed;right:20px;bottom:25px;background:rgba(18,18,18,0.95);color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.25);opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;z-index:1200;font-weight:600}
    .toast.show{opacity:1;transform:none}
  </style>
</head>
<body>

  <div id="toast" class="toast" hidden></div>

  <!-- LOGIN SCREEN -->
  <div id="admin-login-screen">
    <div class="login-card">
      <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
      <form onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="admin-user-input" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="admin-pass-input" placeholder="12345" required>
        </div>
        <button type="submit" class="btn-admin">Login</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="admin-dashboard">
    <header class="admin-header">
      <div class="container" style="display:flex; justify-content:space-between; align-items:center; width:100%; padding:0;">
        <div class="admin-logo">
          <i class="fa-solid fa-gauge-high"></i>
          <span>BIGEST MALL — Ultimate Admin</span>
        </div>
        <button onclick="adminLogout()" style="background:#d32f2f; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:bold;">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </header>

    <main class="container">
      <div class="admin-grid">
        
        <!-- 1. Add Product -->
        <div class="admin-card">
          <h3><i class="fa-solid fa-plus-circle"></i> নতুন প্রোডাক্ট যোগ করুন</h3>
          <form onsubmit="addNewProduct(event)">
            <div class="form-group">
              <label>প্রোডাক্টের নাম</label>
              <input type="text" id="p-name" placeholder="প্রোডাক্টের নাম লিখুন" required>
            </div>
            <div class="form-group">
              <label>মূল্য (টাকা)</label>
              <input type="number" id="p-price" placeholder="দাম লিখুন" required>
            </div>
            <div class="form-group">
              <label>ছবির লিংক (Image URL)</label>
              <input type="text" id="p-img" placeholder="ছবির ডাইরেক্ট লিংক দিন" required>
            </div>
            <button type="submit" class="btn-admin">প্রোডাক্ট যুক্ত করুন</button>
          </form>
        </div>

        <!-- 2. Site Branding (Logo & Banner) -->
        <div class="admin-card">
          <h3><i class="fa-solid fa-image"></i> লোগো ও ব্যানার পরিবর্তন</h3>
          <form onsubmit="updateBranding(event)">
            <div class="form-group">
              <label>লোগো ইমেজ লিংক</label>
              <input type="text" id="site-logo" placeholder="Logo image URL">
            </div>
            <div class="form-group">
              <label>মেইন ব্যানার/স্লাইডার ইমেজ লিংক</label>
              <input type="text" id="site-banner" placeholder="Banner image URL">
            </div>
            <button type="submit" class="btn-admin">ব্র্যান্ডিং সেভ করুন</button>
          </form>
        </div>

        <!-- 3. Policy & Terms Management -->
        <div class="admin-card">
          <h3><i class="fa-solid fa-file-lines"></i> টার্ম्स ও প্রাইভেসি পলিসি</h3>
          <form onsubmit="updatePolicies(event)">
            <div class="form-group">
              <label>শর্তাবলী (Terms & Conditions)</label>
              <textarea id="site-terms" placeholder="শর্তাবলী এখানে লিখুন..."></textarea>
            </div>
            <div class="form-group">
              <label>প্রাইভেসি পলিসি (Privacy Policy)</label>
              <textarea id="site-privacy" placeholder="প্রাইভেসি পলিসি এখানে লিখুন..."></textarea>
            </div>
            <button type="submit" class="btn-admin">পলিসি আপডেট করুন</button>
          </form>
        </div>

        <!-- 4. Change Credentials -->
        <div class="admin-card">
          <h3><i class="fa-solid fa-key"></i> অ্যাডমিন পাসওয়ার্ড পরিবর্তন</h3>
          <form onsubmit="updateCredentials(event)">
            <div class="form-group">
              <label>নতুন ইউজারনেম</label>
              <input type="text" id="new-user" placeholder="New username" required>
            </div>
            <div class="form-group">
              <label>নতুন পাসওয়ার্ড</label>
              <input type="password" id="new-pass" placeholder="New password" required>
            </div>
            <button type="submit" class="btn-admin">পাসওয়ার্ড আপডেট করুন</button>
          </form>
        </div>

      </div>

      <!-- 5. Product Management Table -->
      <div class="admin-card">
        <h3><i class="fa-solid fa-boxes-stacked"></i> বর্তমান প্রোডাক্ট তালিকা ও প্রাইস এডিট</h3>
        <table class="product-list-table">
          <thead>
            <tr>
              <th>নাম</th>
              <th>মূল্য (৳)</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="admin-product-table-body">
            <!-- Dynamic items -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const AUTH_KEY = "bigestmall_auth";
    const PROD_KEY = "bigestmall_products";
    const SETTINGS_KEY = "bigestmall_settings";

    if(!localStorage.getItem(AUTH_KEY)) {
      localStorage.setItem(AUTH_KEY, JSON.stringify({ user: "admin", pass: "12345" }));
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const u = document.getElementById("admin-user-input").value.trim();
      const p = document.getElementById("admin-pass-input").value.trim();
      const saved = JSON.parse(localStorage.getItem(AUTH_KEY));

      if(u === saved.user && p === saved.pass) {
        document.getElementById("admin-login-screen").style.display = "none";
        document.getElementById("admin-dashboard").style.display = "block";
        loadAdminData();
        showToast("সফলভাবে লগইন হয়েছে!");
      } else {
        alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
      }
    }

    function adminLogout() {
      document.getElementById("admin-dashboard").style.display = "none";
      document.getElementById("admin-login-screen").style.display = "flex";
      showToast("লগআউট করা হয়েছে");
    }

    function updateCredentials(e) {
      e.preventDefault();
      const u = document.getElementById("new-user").value.trim();
      const p = document.getElementById("new-pass").value.trim();
      localStorage.setItem(AUTH_KEY, JSON.stringify({ user: u, pass: p }));
      showToast("অ্যাডমিন তথ্য আপডেট হয়েছে!");
      document.getElementById("new-user").value = "";
      document.getElementById("new-pass").value = "";
    }

    function addNewProduct(e) {
      e.preventDefault();
      const name = document.getElementById("p-name").value.trim();
      const price = document.getElementById("p-price").value.trim();
      const img = document.getElementById("p-img").value.trim();

      let products = JSON.parse(localStorage.getItem(PROD_KEY)) || [];
      products.push({ id: Date.now(), name, price, img });
      localStorage.setItem(PROD_KEY, JSON.stringify(products));

      document.getElementById("p-name").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-img").value = "";

      loadAdminProducts();
      showToast("নতুন প্রোডাক্ট সফলভাবে যুক্ত হয়েছে!");
    }

    function updateBranding(e) {
      e.preventDefault();
      let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
      settings.logo = document.getElementById("site-logo").value.trim();
      settings.banner = document.getElementById("site-banner").value.trim();
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      showToast("লোগো ও ব্যানার সেভ হয়েছে!");
    }

    function updatePolicies(e) {
      e.preventDefault();
      let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
      settings.terms = document.getElementById("site-terms").value.trim();
      settings.privacy = document.getElementById("site-privacy").value.trim();
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      showToast("শর্তাবলী ও প্রাইভেসি পলিসি আপডেট হয়েছে!");
    }

    function loadAdminData() {
      loadAdminProducts();
      let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
      if(settings.logo) document.getElementById("site-logo").value = settings.logo;
      if(settings.banner) document.getElementById("site-banner").value = settings.banner;
      if(settings.terms) document.getElementById("site-terms").value = settings.terms;
      if(settings.privacy) document.getElementById("site-privacy").value = settings.privacy;
    }

    function loadAdminProducts() {
      const tbody = document.getElementById("admin-product-table-body");
      let products = JSON.parse(localStorage.getItem(PROD_KEY)) || [];
      
      if(products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">কোনো প্রোডাক্ট নেই</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td>${p.name}</td>
          <td><input type="number" value="${p.price}" onchange="updatePrice(${p.id}, this.value)" style="width:80px; padding:4px;"> ৳</td>
          <td><button class="btn-delete" onclick="deleteProduct(${p.id})">ডিলিট</button></td>
        </tr>
      `).join("");
    }

    function updatePrice(id, newPrice) {
      let products = JSON.parse(localStorage.getItem(PROD_KEY)) || [];
      products = products.map(p => p.id === id ? {...p, price: newPrice} : p);
      localStorage.setItem(PROD_KEY, JSON.stringify(products));
      showToast("প্রোডাক্টের প্রাইস আপডেট করা হয়েছে!");
    }

    function deleteProduct(id) {
      let products = JSON.parse(localStorage.getItem(PROD_KEY)) || [];
      products = products.filter(p => p.id !== id);
      localStorage.setItem(PROD_KEY, JSON.stringify(products));
      loadAdminProducts();
      showToast("প্রোডাক্ট ডিলিট করা হয়েছে!");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.hidden = false;
      t.classList.add("show");
      setTimeout(() => {
        t.classList.remove("show");
        setTimeout(() => t.hidden = true, 220);
      }, 2000);
    }
  </script>
</body>
</html>
